name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  # Mondays, on Orca's newest release: a change in Orca that breaks Matriarch shows up here
  # before it reaches people who updated Orca.
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

# It only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Orca ${{ matrix.orca }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Pushes and PRs: the Orca it was tested with (config.orcaVersion). The weekly run: Orca's
        # newest release. Run by hand: both.
        orca: ${{ fromJSON(github.event_name == 'schedule' && '["newest"]' || github.event_name == 'workflow_dispatch' && '["tested", "newest"]' || '["tested"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Orca refuses a plugin folder that holds binaries other than images, or symlinks.
      - run: pnpm binaries
      - uses: ./.github/actions/setup-orca
        with:
          version: ${{ matrix.orca }}
      # Written by `orca plugin types`, so they match the Orca on PATH.
      - run: pnpm types
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate
