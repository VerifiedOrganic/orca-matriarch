name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# It only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and contents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Orca's directory refuses a release that carries binaries other than images, or symlinks.
      - run: pnpm binaries
      # There is no Orca here: the typings come from the Orca repository at config.orcaVersion.
      - run: pnpm types
      - run: pnpm typecheck
      # The tests and `orca plugin validate` need Orca itself, so they run before each release
      # (pnpm verify); see README, Releasing.
