<!doctype html>
<!-- The directory cover (assets/cover.png): open at 1600×1000 and save as PNG. The plugin page
     shows only about y 380–620 of it, so the name and tagline stay inside that band. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1600px; height: 1000px; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1e1b4b;
         background: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 55%, #ede9fe 100%); position: relative; }
  .text { position: absolute; left: 130px; top: 380px; height: 240px; width: 760px; display: flex; flex-direction: column; justify-content: center; }
  .name { display: flex; align-items: center; gap: 28px; font-size: 92px; font-weight: 750; letter-spacing: -2px; }
  .name img { width: 104px; height: 104px; }
  .tag { font-size: 36px; line-height: 1.3; margin-top: 18px; color: #3730a3; }
  .shot { position: absolute; left: 1010px; top: 70px; width: 440px; border-radius: 18px; overflow: hidden;
          box-shadow: 0 30px 80px rgba(49, 46, 129, 0.28), 0 0 0 1px rgba(49, 46, 129, 0.12); background: #fff; }
  .shot img { display: block; width: 100%; }
</style>
<div class="text">
  <div class="name"><img src="../assets/icon.png" alt="">Matriarch</div>
  <div class="tag">A supervisor and a multi-model review crew for your Orca agents, from plan to merged PR.</div>
</div>
<div class="shot"><img src="../docs/sidebar.png" alt=""></div>
